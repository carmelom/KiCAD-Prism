server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Allow large project-archive uploads (backend caps at 500 MB, see
    # project_import_service.MAX_UPLOAD_BYTES). Default nginx limit is 1 MB.
    client_max_body_size 512M;

    # Content-hashed build assets (Vite emits new filenames per build) can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # The vendored viewer blobs are served from STABLE, unhashed URLs
    # (/ecad-viewer.js etc.), so their URL never changes across redeploys. Force
    # revalidation on every load; otherwise a browser (notably Firefox) keeps a
    # stale copy after a redeploy and, e.g., lands on the wrong schematic sheet
    # because the old bundle lacks the root.kicad_sch landing preference. ETag /
    # Last-Modified make this a cheap 304 when the blob is unchanged.
    location ~* ^/(ecad-viewer|glyph-full|3d-viewer|parser\.worker)\.js$ {
        add_header Cache-Control "no-cache" always;
    }

    # The HTML entrypoint references the hashed assets + importmap, so it must
    # never be served stale.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Prefer outer TLS proto; fall back to $scheme for direct HTTP access.
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # KiCad remote-provider discovery and OAuth endpoints
    location = /.well-known/kicad-remote-provider {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /remote-provider/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
}
